{% load static %}
<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Uzum Market SuperApp</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;900&display=swap" rel="stylesheet">

  <style>
    /* ==========================================================================
       PART 1 & 2: CORE ARCHITECTURE & CHROMATIC PALETTE
       ========================================================================== */
    body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: radial-gradient(circle at center, #7000ff 0%, #2b0066 100%);
      font-family: 'Inter', system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
      transition: opacity 800ms cubic-bezier(0.25, 1, 0.5, 1), transform 800ms cubic-bezier(0.25, 1, 0.5, 1);
    }

    body.fade-out {
      opacity: 0;
      transform: scale(1.04);
    }

    /* Ambient Lighting Orbs */
    .ambient-orb-1 {
      position: absolute; top: -10%; right: 90%;
      width: 50vw; height: 50vw;
      background: rgba(243, 112, 33, 0.15); /* Tangerine */
      filter: blur(100px); border-radius: 50%; z-index: 0; pointer-events: none;
    }
    .ambient-orb-2 {
      position: absolute; bottom: 110%; left: -10%;
      width: 60vw; height: 60vw;
      background: rgba(255, 190, 26, 0.1); /* Electric Gold */
      filter: blur(120px); border-radius: 50%; z-index: 0; pointer-events: none;
    }

    /* ==========================================================================
       PART 3: EMBEDDED FIXED LOGO PROTECTION
       ========================================================================== */
    .logo-container {
      position: relative;
      z-index: 10;
      background: #ffffff;
      border-radius: 32px;
      border: 4px solid rgba(243, 112, 33, 0.3); /* Tangerine 30% */
      box-shadow: 0 20px 40px rgba(0,0,0,0.4), 0 10px 20px rgba(112,0,255,0.2);
      animation: logoEntrance 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards,
                 logoPulse 2s ease-in-out infinite 0.8s alternate;
    }

    @keyframes logoEntrance {
      0% { transform: scale(0.3); opacity: 0; }
      100% { transform: scale(1.05); opacity: 1; }
    }

    @keyframes logoPulse {
      0% { box-shadow: 0 20px 40px rgba(0,0,0,0.4), 0 0 20px rgba(112, 0, 255, 0.4); transform: scale(1.05); }
      100% { box-shadow: 0 20px 40px rgba(0,0,0,0.4), 0 0 30px rgba(243, 112, 33, 0.6); transform: scale(1.07); }
    }

    .logo-img {
      width: 144px; height: 144px;
      object-fit: contain; border-radius: 28px;
    }

    /* ==========================================================================
       PART 5: PREMIUM PROGRESSION MECHANICS
       ========================================================================== */
    .progress-wrapper {
      width: 280px; height: 6px;
      background: rgba(255, 255, 255, 0.15);
      border-radius: 10px;
      backdrop-filter: blur(8px);
      overflow: hidden; position: relative; z-index: 10;
    }

    .progress-fill {
      height: 100%; width: 0%;
      background: linear-gradient(90deg, #ffbe1a, #f37021, #ffbe1a);
      background-size: 200% 100%;
      border-radius: 10px; position: relative;
      animation: progressSteps 2.8s cubic-bezier(0.4, 0, 0.2, 1) forwards, gradientShift 2s linear infinite;
    }

    /* Glossy optical illusion stripe */
    .progress-fill::after {
      content: ''; position: absolute; top: 0; left: 0; bottom: 0; right: 0;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.6), transparent);
      animation: glossMove 1s infinite linear;
    }

    @keyframes progressSteps {
      0% { width: 0%; }
      17% { width: 25%; } /* 0.5s */
      42% { width: 55%; } /* 1.2s */
      78% { width: 85%; } /* 2.2s */
      100% { width: 100%; } /* 2.8s */
    }

    @keyframes gradientShift {
      0% { background-position: 100% 0; } 100% { background-position: -100% 0; }
    }

    @keyframes glossMove {
      0% { transform: translateX(-100%); } 100% { transform: translateX(100%); }
    }

    /* ==========================================================================
       PART 4: KINETIC CAR DELIVERY SIMULATION
       ========================================================================== */
    .road-track {
      position: absolute; bottom: 12vh; width: 100%; height: 2px;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.4), transparent);
      z-index: 5;
    }

    .vehicle-capsule {
      position: absolute; bottom: calc(12vh - 4px); left: -150px;
      display: flex; align-items: flex-end; gap: 4px;
      filter: drop-shadow(0 5px 15px rgba(243, 112, 33, 0.4));
      animation: drivePhysics 3.5s cubic-bezier(0.25, 1, 0.5, 1) forwards;
      z-index: 10;
    }

    @keyframes drivePhysics {
      0% { left: -150px; transform: scaleX(1); }
      48% { left: 48%; transform: scaleX(1) translateX(-50%); }
      54% { left: 48%; transform: scaleX(1) translateX(-50%) translateY(-6px); } /* Recoil */
      60% { left: 48%; transform: scaleX(1) translateX(-50%) translateY(0); }
      100% { left: 120%; transform: scaleX(1.1); }
    }

    .smoke-particle {
      position: absolute; bottom: 2px; left: -15px; width: 8px; height: 8px;
      background: #ffffff; border-radius: 50%;
      animation: smokePoof 0.6s infinite ease-out;
    }

    @keyframes smokePoof {
      0% { transform: scale(0.5); opacity: 0.8; }
      100% { transform: scale(2) translate(-20px, -5px); opacity: 0; background: #f37021; }
    }

    /* ==========================================================================
       PART 8: RESPONSIVE SCREEN-SIZE MATRIX
       ========================================================================== */
    @media (min-width: 1200px) {
      .main-content { transform: scale(1.1); }
      .progress-wrapper { width: 320px; }
      .logo-img { width: 144px; height: 144px; }
    }
    @media (max-width: 1199px) and (min-width: 641px) {
      .logo-img { width: 128px; height: 128px; }
      .progress-wrapper { width: 280px; }
    }
    @media (max-width: 640px) {
      .logo-container { border-radius: 24px; }
      .logo-img { width: 100px; height: 100px; border-radius: 20px; }
      .progress-wrapper { width: 210px; }
      .vehicle-capsule { animation-duration: 3s; /* 15% faster on mobile */ }
    }
  </style>
</head>
<body class="flex flex-col items-center justify-center h-screen relative select-none">

  <div class="ambient-orb-1"></div>
  <div class="ambient-orb-2"></div>

  <div class="main-content flex flex-col items-center z-10 w-full px-4">
    
    <div class="logo-container p-3 mb-8">
      <img src="https://logo-teka.com/wp-content/uploads/2026/04/uzum-market-icon-logo.png" 
           class="logo-img" 
           alt="Uzum Market SuperApp"
           onerror="this.onerror=null; this.src='data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIxMDAiIGhlaWdodD0iMTAwIiB2aWV3Qm94PSIwIDAgMjQgMjQiIGZpbGw9Im5vbmUiIHN0cm9rZT0iI2YzNzAyMSIgc3Ryb2tlLXdpZHRoPSIyIiBzdHJva2UtbGluZWNhcD0icm91bmQiIHN0cm9rZS1saW5lam9pbj0icm91bmQiPjxwYXRoIGQ9Ik02IDJsMTIgMTIgNi02Ii8+PC9zdmc+';">
    </div>

    <div class="text-center mb-6">
      <h1 class="text-3xl md:text-4xl font-[900] tracking-[-0.05em] mb-2 leading-none">
        <span class="text-[#ffffff]">uzum</span> <span class="text-[#ffbe1a]">market</span>
      </h1>
      <p class="text-[#d6c2ff] text-[10px] md:text-xs font-medium tracking-[0.25em] uppercase">
        Bir kunda bepul yetkazib berish
      </p>
    </div>

    <div class="progress-wrapper mb-3 shadow-inner">
      <div class="progress-fill"></div>
    </div>
    
    <p class="text-[11px] font-medium text-white/70 tracking-wide transition-opacity duration-300" id="chrono-status">
      Xavfsiz ulanish o'rnatilmoqda...
    </p>
  </div>

  <div class="road-track"></div>
  <div class="vehicle-capsule">
    <div class="bg-[#f37021] text-white text-[9px] px-1.5 py-0.5 rounded-sm font-bold italic shadow-lg mb-1 transform -rotate-12">
      UZUM
    </div>
    <i class="fas fa-truck-fast text-4xl text-[#ffffff]"></i>
    <div class="smoke-particle"></div>
  </div>

  <script>
    // Intelligent Status Messenger Timing
    const statusEl = document.getElementById('chrono-status');
    const phases = [
      { time: 800, text: "Katalog va chegirmalar yangilanmoqda..." },
      { time: 1600, text: "Siz uchun eng yaxshi takliflar saralanmoqda..." },
      { time: 2400, text: "Tizim tayyor. Shaxsiy sahifaga o'tilmoqda..." }
    ];

    let timeouts = [];

    // Schedule text updates
    phases.forEach(phase => {
      let t = setTimeout(() => {
        statusEl.style.opacity = 0;
        setTimeout(() => {
          statusEl.innerText = phase.text;
          statusEl.style.opacity = 1;
        }, 150);
      }, phase.time);
      timeouts.push(t);
    });

    // Final Exit Protocol locked at 3200ms
    let exitTimeout = setTimeout(() => {
      // Clear thread isolation
      timeouts.forEach(clearTimeout);
      
      // Trigger smooth dismissal
      document.body.classList.add('fade-out');
      
      // Execute final navigation
      setTimeout(() => {
        window.location.replace("{% url 'home' %}");
      }, 800); // Wait for the fade-out CSS transition
      
    }, 3200);
  </script>
</body>
</html>
